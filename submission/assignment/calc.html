<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <div class="calculator-header">Calculator</div>

    <input type="text" class="display" readonly>

    <div class="buttons">

        <!-- الصف الأول -->
        <button class="btn-clear">C</button>
        <button class="btn-op">/</button>

        <!-- الصف الثاني -->
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="btn-op">*</button>

        <!-- الصف الثالث -->
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="btn-op">-</button>

        <!-- الصف الرابع -->
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="btn-op">+</button>

        <!-- الصف الخامس -->
        <button class="btn-zero">0</button>
        <button>.</button>
        <button class="btn-eq">=</button>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
